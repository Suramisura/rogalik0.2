function render(){
  const cw = cv.width, ch = cv.height;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#04060a';
  ctx.fillRect(0, 0, cw, ch);
  const vt = getView();
  ctx.setTransform(vt.scale, 0, 0, vt.scale, vt.ox, vt.oy);

  game.hoverTooltip = null;

  if (game.settingsView){ drawSettingsScreen(); return; }

  if (game.state === 'start'){
    drawStartScreen();
    if (game.encOpen) drawEncyclopedia();
    if (game.lbOpen) drawLeaderboard();
    return;
  }

  ctx.save();
  if (game.shake > 0){
    const s = game.shake*14;
    ctx.translate((Math.random()-0.5)*s, (Math.random()-0.5)*s);
  }
  ctx.save();
  ctx.translate(-cam.x, -cam.y);
  drawArenaBg();
  if (game.buildMode) drawBuildOverlay();
  drawFaction();
  drawCore();
  drawModules();
  drawRocks();
  drawEnemies();
  drawShots();
  drawPlayer();
  drawParts();
  ctx.restore();
  ctx.restore();

  if (game.dayPhase === 'night'){
    const vg = ctx.createRadialGradient(LOGICAL_W/2, LOGICAL_H/2, LOGICAL_H*0.35, LOGICAL_W/2, LOGICAL_H/2, LOGICAL_H*0.85);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(20,10,50,0.7)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);
  }
  if (game.dayTransition > 0){
    const a = game.dayTransition;
    ctx.fillStyle = game.dayPhase === 'night' ? 'rgba(20,10,50,'+(a*0.4)+')' : 'rgba(255,220,150,'+(a*0.3)+')';
    ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);
  }

  drawHUD();
  drawMinimap();

  if (game.dmgFlash > 0){
    const a = game.dmgFlash;
    const grad = ctx.createRadialGradient(LOGICAL_W/2, LOGICAL_H/2, LOGICAL_H*0.3, LOGICAL_W/2, LOGICAL_H/2, LOGICAL_H*0.85);
    grad.addColorStop(0, 'rgba(255,40,40,0)');
    grad.addColorStop(1, 'rgba(255,40,40,'+(a*0.55)+')');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);
  }
  if (game.goldFlash > 0){
    ctx.fillStyle = 'rgba(255,220,120,'+(game.goldFlash*0.18)+')';
    ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);
  }
  if (game.coreSaveFlash > 0){
    const a = game.coreSaveFlash;
    ctx.fillStyle = 'rgba(180,220,255,'+(a*0.6)+')';
    ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);
  }

  if (game.state === 'wave_clear') drawWaveClear();
  if (game.state === 'upgrade') drawUpgradeScreen();
  if (game.state === 'dead') drawDeathScreen();
  if (game.pause && game.pause.open) drawPauseMenu();
  if (game.encOpen) drawEncyclopedia();
  if (game.lbOpen) drawLeaderboard();
}

function drawBuildOverlay(){
  const blink = 0.55+0.45*Math.sin(game.t*7);
  const maxR = maxRing();
  for (let c=0;c<WC;c++){
    for (let r=0;r<WR;r++){
      const dist = cellDistance(c, r);
      if (dist === 0) continue;
      const x = cellX(c), y = cellY(r);
      const key = c+','+r;
      const m = game.modules[key];
      if (dist > maxR){
        if (dist === maxR+1){
          ctx.strokeStyle = 'rgba(60,40,80,0.35)';
          ctx.setLineDash([4,4]); ctx.lineWidth = 1;
          ctx.strokeRect(x+2.5, y+2.5, CELL-5, CELL-5);
          ctx.setLineDash([]);
        }
        continue;
      }
      if (m){
        const cost = moduleCost(m.type, m.level+1);
        const ok = game.stones >= cost && m.level < 5;
        ctx.fillStyle = ok ? 'rgba(224,180,74,'+(0.10*blink+0.06)+')' : 'rgba(140,140,140,0.05)';
        ctx.fillRect(x+2, y+2, CELL-4, CELL-4);
        ctx.strokeStyle = ok ? 'rgba(224,180,74,'+(0.6*blink+0.25)+')' : 'rgba(120,120,120,0.35)';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(x+2.5, y+2.5, CELL-5, CELL-5);
      } else {
        const type = MOD_ORDER[game.buildSel];
        const cost = moduleCost(type, 1);
        let ok = game.stones >= cost;
        if (type === 'tower' && countTowers() >= game.stats.maxTowers) ok = false;
        ctx.fillStyle = ok ? 'rgba(80,220,160,'+(0.10*blink+0.05)+')' : 'rgba(220,80,80,'+(0.08*blink+0.03)+')';
        ctx.fillRect(x+2, y+2, CELL-4, CELL-4);
        ctx.strokeStyle = ok ? 'rgba(80,220,160,'+(0.5*blink+0.15)+')' : 'rgba(220,80,80,0.35)';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(x+2.5, y+2.5, CELL-5, CELL-5);
      }
    }
  }
  const hc = Math.floor(mouse.wx/CELL), hr = Math.floor(mouse.wy/CELL);
  if (isBuildable(hc, hr) && !game.modules[hc+','+hr]){
    const col = MODULES[MOD_ORDER[game.buildSel]].color;
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = col;
    rr(cellX(hc)+5, cellY(hr)+5, CELL-10, CELL-10, 7);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

function updateMouse(e){
  const r = cv.getBoundingClientRect();
  const vt = getView();
  const px = (e.clientX-r.left)/r.width*cv.width;
  const py = (e.clientY-r.top)/r.height*cv.height;
  mouse.x = (px-vt.ox)/vt.scale;
  mouse.y = (py-vt.oy)/vt.scale;
  mouse.wx = mouse.x+cam.x;
  mouse.wy = mouse.y+cam.y;
}

function startGame(){
  resetGame();
  game.state = 'playing';
  game.wave = 1;
  game.waveActive = true;
  game.spawnQueue = buildWave(1).list;
  game.spawnTimer = 0.4;
  game.waveModifier = 'normal';
  flash('ВОЛНА 1: ' + waveComposition(1));
}

window.addEventListener('keydown', function(e){
  const code = e.code;
  keys[code] = true;
  if (['Space','Tab','Escape','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Enter'].indexOf(code) >= 0) e.preventDefault();

  if (game.settingsView){
    if (code === 'Escape'){ game.settingsView = false; saveSettings(); }
    return;
  }
  if (game.pause && game.pause.open){
    if (game.pause.confirm){
      if (code === 'KeyY'){ executePauseAction(game.pause.confirm); return; }
      if (code === 'KeyN' || code === 'Escape'){ game.pause.confirm = null; return; }
      return;
    }
    if (code === 'Escape'){ game.pause.open = false; return; }
    const items = getPauseItems();
    if (code === 'ArrowUp'){ game.pause.sel = (game.pause.sel-1+items.length)%items.length; return; }
    if (code === 'ArrowDown'){ game.pause.sel = (game.pause.sel+1)%items.length; return; }
    if (code === 'Enter'){ executePauseAction(items[game.pause.sel]); return; }
    return;
  }
  if (code === 'Tab'){
    game.encOpen = !game.encOpen;
    return;
  }
  if (game.encOpen){
    if (code === 'Escape'){ game.encOpen = false; return; }
    const d = code.match(/^Digit([1-9])$/);
    if (d){ const i = parseInt(d[1],10)-1; if (i < ENC_TABS.length) game.encTab = i; return; }
    return;
  }
  if (game.lbOpen){
    if (code === 'Escape' || code === 'KeyL'){ game.lbOpen = false; return; }
    return;
  }
  if (code === 'Escape'){
    if (game.state === 'playing' || game.state === 'upgrade' || game.state === 'wave_clear'){
      game.pause = { open:true, sel:0, confirm:null };
      return;
    }
    if (game.state === 'dead'){ resetGame(); return; }
    return;
  }
  if (game.state === 'start'){
    if (code === 'Space' || code === 'Enter'){ startGame(); return; }
    if (code === 'KeyL'){ game.lbOpen = true; return; }
    return;
  }
  if (game.state === 'dead'){
    if (code === 'KeyR'){ startGame(); return; }
    if (code === 'KeyL'){ game.lbOpen = true; return; }
    return;
  }
  if (game.state === 'upgrade'){
    if (code === 'Digit1' || code === 'Digit2' || code === 'Digit3'){
      const idx = parseInt(code.slice(-1),10)-1;
      if (idx >= 0 && idx < game.choices.length) applyChoice(game.choices[idx]);
    }
    return;
  }
  if (game.state === 'playing' || game.state === 'wave_clear'){
    if (code === 'KeyB'){ game.buildMode = !game.buildMode; return; }
    if (code === 'KeyU'){ upgradeCore(); return; }
    if (code === 'KeyX' && game.buildMode){
      const c = Math.floor(mouse.wx/CELL), r = Math.floor(mouse.wy/CELL);
      const m = game.modules[c+','+r];
      if (m) disassemble(m);
      return;
    }
    const dm = code.match(/^(Digit|Numpad)([1-5])$/);
    if (dm){
      game.buildSel = parseInt(dm[2],10)-1;
      game.buildMode = true;
      return;
    }
    if (code === 'Space' && !game.waveActive && game.state === 'playing'){
      // №11: +4 камня за досрочный старт
      if (game.prepTimer > 0){
        game.stones += 4;
        game.stonePulse = 1;
        floatText(game.player.x, game.player.y-40, '+4 камня', '#ffd970', 14);
      }
      game.prepTimer = 0;
      startWave();
      return;
    }
  }
});

window.addEventListener('keyup', function(e){ keys[e.code] = false; });
cv.addEventListener('mousemove', updateMouse);

cv.addEventListener('mousedown', function(e){
  updateMouse(e);
  if (game.settingsView){
    if (e.button !== 0) return;
    const resKeys = ['small','medium','large','xl'];
    for (let i=0;i<resKeys.length;i++){
      const bx = LOGICAL_W/2-380+i*145, by = 140;
      if (mouse.x>bx && mouse.x<bx+138 && mouse.y>by && mouse.y<by+42){
        settings.resolution = resKeys[i]; applySettings(); saveSettings(); return;
      }
    }
    const mapKeys = ['standard','big','huge'];
    for (let i=0;i<mapKeys.length;i++){
      const bx = LOGICAL_W/2-380+i*180, by = 240;
      if (mouse.x>bx && mouse.x<bx+170 && mouse.y>by && mouse.y<by+42){
        settings.mapSize = mapKeys[i]; saveSettings(); return;
      }
    }
    const fontKeys = ['normal','large','huge'];
    for (let i=0;i<fontKeys.length;i++){
      const bx = LOGICAL_W/2-380+i*180, by = 340;
      if (mouse.x>bx && mouse.x<bx+170 && mouse.y>by && mouse.y<by+42){
        settings.font = fontKeys[i]; applySettings(); saveSettings(); return;
      }
    }
    const tipVals = [true, false];
    for (let i=0;i<2;i++){
      const bx = LOGICAL_W/2-380+i*180, by = 440;
      if (mouse.x>bx && mouse.x<bx+170 && mouse.y>by && mouse.y<by+42){
        settings.tooltips = tipVals[i]; saveSettings(); return;
      }
    }
    if (mouse.x>LOGICAL_W/2-120 && mouse.x<LOGICAL_W/2+120 && mouse.y>LOGICAL_H-100 && mouse.y<LOGICAL_H-56){
      game.settingsView = false; saveSettings(); return;
    }
    return;
  }
  if (game.pause && game.pause.open){
    if (e.button !== 0) return;
    const items = getPauseItems();
    const by0 = 200;
    for (let i=0;i<items.length;i++){
      const by = by0+i*52;
      if (mouse.x>LOGICAL_W/2-200 && mouse.x<LOGICAL_W/2+200 && mouse.y>by && mouse.y<by+42){
        game.pause.sel = i;
        executePauseAction(items[i]);
        return;
      }
    }
    return;
  }
  if (game.encOpen){
    if (e.button !== 0) return;
    const tw = 80, gap = 3;
    const totalW = ENC_TABS.length*(tw+gap)-gap;
    const tx0 = (LOGICAL_W-totalW)/2;
    for (let i=0;i<ENC_TABS.length;i++){
      const tx = tx0+i*(tw+gap);
      if (mouse.x>tx && mouse.x<tx+tw && mouse.y>44 && mouse.y<68){ game.encTab = i; return; }
    }
    return;
  }
  if (game.lbOpen){
    if (e.button !== 0) return;
    const buttons = [
      { x:60, y:LOGICAL_H-80, w:180, h:36, action:'sort' },
      { x:260, y:LOGICAL_H-80, w:180, h:36, action:'clear' },
      { x:LOGICAL_W-200, y:LOGICAL_H-80, w:180, h:36, action:'close' }
    ];
    for (const b of buttons){
      if (mouse.x>b.x && mouse.x<b.x+b.w && mouse.y>b.y && mouse.y<b.y+b.h){
        if (b.action === 'sort') game.lbSort = game.lbSort === 'score' ? 'wave' : 'score';
        else if (b.action === 'clear'){
          if (game.lbConfirm){ localStorage.removeItem('castle_leaderboard'); game.lbConfirm = false; }
          else game.lbConfirm = true;
        }
        else if (b.action === 'close') game.lbOpen = false;
        return;
      }
    }
    return;
  }
  if (game.state === 'start'){
    if (e.button !== 0) return;
    for (const b of startMenuButtons()){
      if (mouse.x>b.x && mouse.x<b.x+b.w && mouse.y>b.y && mouse.y<b.y+b.h){
        if (b.action === 'play') startGame();
        else if (b.action === 'leaderboard') game.lbOpen = true;
        else if (b.action === 'encyclopedia') game.encOpen = true;
        else if (b.action === 'settings') game.settingsView = true;
        return;
      }
    }
    return;
  }
  if (game.state === 'dead'){
    if (e.button !== 0) return;
    const buttons = [
      { x:LOGICAL_W/2-260, y:380, w:160, h:44, action:'restart' },
      { x:LOGICAL_W/2-80,  y:380, w:160, h:44, action:'leaderboard' },
      { x:LOGICAL_W/2+100, y:380, w:160, h:44, action:'menu' }
    ];
    for (const b of buttons){
      if (mouse.x>b.x && mouse.x<b.x+b.w && mouse.y>b.y && mouse.y<b.y+b.h){
        if (b.action === 'restart') startGame();
        else if (b.action === 'leaderboard') game.lbOpen = true;
        else if (b.action === 'menu'){ resetGame(); }
        return;
      }
    }
    return;
  }
  if (game.state === 'upgrade'){
    if (e.button !== 0) return;
    if (game.upgradeFreezeT > 0) return;
    const cw = 280, ch = 250;
    const totalW = cw*3+40;
    const sx = (LOGICAL_W-totalW)/2;
    const cy = 150;
    for (let i=0;i<game.choices.length;i++){
      const x = sx+i*(cw+20);
      if (mouse.x>x && mouse.x<x+cw && mouse.y>cy && mouse.y<cy+ch){
        applyChoice(game.choices[i]);
        return;
      }
    }
    return;
  }
  if (game.state === 'playing' || game.state === 'wave_clear'){
    if (e.button === 2){
      if (game.buildMode){
        const c = Math.floor(mouse.wx/CELL), r = Math.floor(mouse.wy/CELL);
        const m = game.modules[c+','+r];
        if (m) disassemble(m);
      }
      return;
    }
    if (e.button !== 0) return;
    const by = LOGICAL_H-78;
    const bw = 165;
    for (let i=0;i<MOD_ORDER.length;i++){
      const bx = 8+i*(bw+6), byy = by+22;
      if (mouse.x>bx && mouse.x<bx+bw && mouse.y>byy && mouse.y<byy+42){
        game.buildSel = i; game.buildMode = true; return;
      }
    }
    if (game.buildMode){
      tryPlace(mouse.wx, mouse.wy);
    } else {
      mouse.down = true;
      tryAttack();
    }
  }
});

window.addEventListener('mouseup', function(){ mouse.down = false; });
cv.addEventListener('contextmenu', function(e){ e.preventDefault(); });

// ============================================================
// ГЛАВНЫЙ ЦИКЛ
// ============================================================
let last = performance.now();
function loop(now){
  let dt = (now-last)/1000;
  last = now;
  if (dt > 0.05) dt = 0.05;
  if (dt < 0) dt = 0;

  mouse.wx = mouse.x+cam.x;
  mouse.wy = mouse.y+cam.y;

  if (game && game.hitstop > 0){
    game.hitstop -= dt;
    render();
    requestAnimationFrame(loop);
    return;
  }
  if (game) update(dt);
  render();
  requestAnimationFrame(loop);
}

// ============================================================
// ИНИЦИАЛИЗАЦИЯ
// ============================================================
loadSettings();
resetGame();
requestAnimationFrame(loop);

})();
</script>
